<script>
/* 07/11/2026: amkvehiculos.cl/v/CHASIS/ es la página corta de cada vehículo (la crea Sistema, con su foto para la
   miniatura al compartir). Si todavía no existe o el vehículo ya salió de la web, se llega acá: salta a su ficha
   (?ch=CHASIS) o, si no es un link de vehículo, a la portada. Así ningún link compartido queda roto. */
(function(){
  var m=location.pathname.match(/^\/v\/([^\/?#]+)/), q=new URLSearchParams(location.search);
  if(m){ q.set('ch',decodeURIComponent(m[1])); location.replace('/?'+q+location.hash); }
  else location.replace('/');
})();
</script>
